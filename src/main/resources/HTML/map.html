<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Opola - Sieć Światłowodowa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .camera-icon-wrapper {
            background: #2c3e50;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        .popup-details-link {
            color: #2980b9;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .fiber-vertex-marker {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    window.L_DISABLE_3D = true;
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var opoleBounds = [
        [50.5500, 17.7500],
        [50.8000, 18.1000]
    ];

    var map = L.map('map', {
        maxBounds: opoleBounds,
        maxBoundsViscosity: 1.0,
        minZoom: 12,
        maxZoom: 18,
        fadeAnimation: false,
        zoomAnimation: false,
        markerZoomAnimation: false,
        inertia: false,
        doubleClickZoom: false
    }).setView([50.6751, 17.9213], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var pendingCameraName = null;
    var isDrawingFiber = false;
    var currentFiberName = null;
    var fiberPoints = [];
    var tempPolyline = null;

    var activeAppendFiberId = null;
    var activeAppendEnd = null; // 'start' lub 'end'
    var activeDeleteFiberId = null; // ID światłowodu w trybie usuwania wierzchołków

    // Historia zmian dla światłowodów (klucz to ID światłowodu, wartość to tablica poprzednich stanów punktów)
    var fiberHistoryStack = {};

    var elements = {};
    var elementIdCounter = 1;

    // Globalne stany widoczności
    var camerasGlobalVisible = true;
    var fibersGlobalVisible = true;

    function createCameraIcon() {
        var svgIcon = '<div class="camera-icon-wrapper">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>' +
            '<circle cx="12" cy="13" r="4"></circle>' +
            '</svg></div>';

        return L.divIcon({
            className: 'custom-camera-marker',
            html: svgIcon,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
        });
    }

    function createCameraPopupHtml(id, name) {
        return "<b>Kamera: </b>" + name + "<br>" +
            "<a class='popup-details-link' onclick='triggerDetails(" + id + ")'>🔍 Szczegóły</a>";
    }

    function triggerDetails(id) {
        try {
            if (window.javaBridge && typeof window.javaBridge.showDetails === 'function') {
                window.javaBridge.showDetails(id);
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Generowanie listy z podziałem na grupy (Kamery i Światłowody) oraz licznikami
    function getElementsListString() {
        let camerasArray = [];
        let fibersArray = [];

        for (let id in elements) {
            let el = elements[id];
            let visIcon = el.visible !== false ? "👁" : "👁‍🗨";
            let itemStr = visIcon + " " + el.name + " [" + id + "]";

            if (el.type === 'camera') {
                camerasArray.push(itemStr);
            } else if (el.type === 'fiber') {
                fibersArray.push(itemStr);
            }
        }

        let result = [];
        result.push("📡 Kamery (" + camerasArray.length + ")");
        camerasArray.forEach(c => result.push(c));

        result.push("💡 Światłowody (" + fibersArray.length + ")");
        fibersArray.forEach(f => result.push(f));

        return result.join(";;");
    }

    function syncWithJava() {
        try {
            if (window.javaBridge && typeof window.javaBridge.syncElements === 'function') {
                window.javaBridge.syncElements(getElementsListString());
            }
        } catch (e) {
            console.error(e);
        }
    }

    function deleteElement(id) {
        if (elements[id]) {
            disableFiberEditing(id);
            if (elements[id].layer) {
                map.removeLayer(elements[id].layer);
            }
            delete elements[id];
            delete fiberHistoryStack[id];
            syncWithJava();
        }
    }

    function renameElement(id, newName) {
        if (elements[id]) {
            elements[id].name = newName;
            let el = elements[id];

            if (el.type === 'camera') {
                el.layer.setPopupContent(createCameraPopupHtml(id, newName));
            } else if (el.type === 'fiber') {
                updateFiberPopup(el);
            }
            syncWithJava();
        }
    }

    function editFiberData(id, newColor, newWeight) {
        if (elements[id] && elements[id].type === 'fiber') {
            let el = elements[id];
            if (newColor) el.color = newColor;
            if (newWeight) el.weight = parseInt(newWeight);

            el.layer.setStyle({
                color: el.color,
                weight: el.weight
            });
            updateFiberPopup(el);
        }
    }

    function getFiberData(id) {
        if (elements[id] && elements[id].type === 'fiber') {
            return JSON.stringify({
                id: id,
                name: elements[id].name,
                color: elements[id].color,
                weight: elements[id].weight
            });
        }
        return null;
    }

    function updateFiberPopup(el) {
        let hasHistory = fiberHistoryStack[el.id] && fiberHistoryStack[el.id].length > 0;
        let undoBtnHtml = hasHistory ? "<br><a class='popup-details-link' style='color:#e67e22;' onclick='undoLastFiberChange(" + el.id + ")'>↩️ Cofnij zmianę</a>" : "";

        el.layer.setPopupContent(
            "<b>Światłowód: </b>" + el.name + "<br>" +
            "<b>Kolor: </b><span style='color:" + el.color + ";'>███</span> (" + el.color + ")<br>" +
            "<b>Grubość: </b>" + el.weight + "px<br>" +
            "<a class='popup-details-link' style='color:#27ae60;' onclick='enableFiberEndPointsSelection(" + el.id + ")'>🟢 Dorysuj od końców</a><br>" +
            "<a class='popup-details-link' style='color:#c0392b;' onclick='enableFiberVertexDeletionMode(" + el.id + ")'>❌ Usuń wierzchołki</a>" +
            undoBtnHtml
        );
    }

    function disableFiberEditing(id) {
        let el = elements[id];
        if (!el) return;

        if (el.editMarkers) {
            el.editMarkers.forEach(m => map.removeLayer(m));
        }
        el.editMarkers = [];
        el.isEditing = false;

        if (activeDeleteFiberId === id) {
            activeDeleteFiberId = null;
        }

        if (tempPolyline) {
            map.removeLayer(tempPolyline);
            tempPolyline = null;
        }
    }

    // Tryb dorysowywania: wyświetlanie kropek na końcach światłowodu
    function enableFiberEndPointsSelection(id) {
        let el = elements[id];
        if (!el || el.type !== 'fiber') return;
        el.id = id;

        for (let otherId in elements) {
            disableFiberEditing(otherId);
        }

        el.isEditing = true;
        activeDeleteFiberId = null;
        el.editMarkers = [];

        let latLngs = el.layer.getLatLngs();
        if (latLngs.length < 2) return;

        let startPoint = latLngs[0];
        let endPoint = latLngs[latLngs.length - 1];

        let startMarker = L.marker(startPoint, {
            icon: L.divIcon({
                className: 'fiber-vertex-marker',
                html: '<div style="background:#2ecc71; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 6px rgba(0,0,0,0.8);" title="Kliknij, aby dorysować od POCZĄTKU"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            })
        }).addTo(map);

        startMarker.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            activeAppendFiberId = id;
            activeAppendEnd = 'start';

            startMarker.remove();
            endMarker.remove();
            el.editMarkers = [];

            fiberPoints = [startPoint];
        });

        let endMarker = L.marker(endPoint, {
            icon: L.divIcon({
                className: 'fiber-vertex-marker',
                html: '<div style="background:#e74c3c; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 6px rgba(0,0,0,0.8);" title="Kliknij, aby dorysować od KOŃCA"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            })
        }).addTo(map);

        endMarker.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            activeAppendFiberId = id;
            activeAppendEnd = 'end';

            startMarker.remove();
            endMarker.remove();
            el.editMarkers = [];

            fiberPoints = [endPoint];
        });

        el.editMarkers.push(startMarker, endMarker);
    }

    // Dedykowany tryb usuwania wierzchołków światłowodu
    function enableFiberVertexDeletionMode(id) {
        let el = elements[id];
        if (!el || el.type !== 'fiber') return;
        el.id = id;

        for (let otherId in elements) {
            disableFiberEditing(otherId);
        }

        el.isEditing = true;
        activeDeleteFiberId = id;
        el.editMarkers = [];

        let latLngs = el.layer.getLatLngs();
        if (latLngs.length < 2) return;

        latLngs.forEach((pt, index) => {
            let vertexMarker = L.marker(pt, {
                icon: L.divIcon({
                    className: 'fiber-vertex-marker',
                    html: '<div style="background:#e74c3c; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 5px rgba(0,0,0,0.8);" title="Kliknij, aby USUNĄĆ ten wierzchołek światłowodu"></div>',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                })
            }).addTo(map);

            vertexMarker.on('click', function(e) {
                L.DomEvent.stopPropagation(e);
                removeFiberVertex(id, index);
            });

            el.editMarkers.push(vertexMarker);
        });
    }

    // Zapisanie stanu do historii przed modyfikacją
    function saveFiberStateToHistory(id) {
        let el = elements[id];
        if (!el || el.type !== 'fiber') return;

        if (!fiberHistoryStack[id]) {
            fiberHistoryStack[id] = [];
        }

        let currentPts = el.layer.getLatLngs().map(p => L.latLng(p.lat, p.lng));
        fiberHistoryStack[id].push(currentPts);
    }

    // Cofnięcie ostatniej zmiany na światłowodzie (Undo)
    function undoLastFiberChange(id) {
        let el = elements[id];
        if (!el || !fiberHistoryStack[id] || fiberHistoryStack[id].length === 0) return;

        let previousPts = fiberHistoryStack[id].pop();
        el.layer.setLatLngs(previousPts);

        disableFiberEditing(id);
        updateFiberPopup(el);
        syncWithJava();
        el.layer.openPopup();
    }

    // Usuwanie konkretnego punktu (wierzchołka) światłowodu
    function removeFiberVertex(id, index) {
        let el = elements[id];
        if (!el || el.type !== 'fiber') return;

        let latLngs = el.layer.getLatLngs();
        if (latLngs.length <= 2) {
            deleteElement(id);
            return;
        }

        saveFiberStateToHistory(id);

        latLngs.splice(index, 1);
        el.layer.setLatLngs(latLngs);

        disableFiberEditing(id);
        enableFiberVertexDeletionMode(id); // Odświeżenie trybu usuwania po modyfikacji
        updateFiberPopup(el);
        syncWithJava();
        el.layer.openPopup();
    }

    // Podświetlanie elementu po najechaniu myszką z poziomu listy JavaFX
    function highlightElement(id) {
        let el = elements[id];
        if (!el || el.visible === false) return;
        if (el.type === 'fiber') {
            el.originalWeight = el.layer.options.weight;
            el.layer.setStyle({ color: '#f1c40f', weight: el.originalWeight + 4 });
            el.layer.bringToFront();
        } else if (el.type === 'camera') {
            if (el.layer._icon) {
                el.layer._icon.style.transform += ' scale(1.3)';
            }
        }
    }

    function unhighlightElement(id) {
        let el = elements[id];
        if (!el || el.visible === false) return;
        if (el.type === 'fiber') {
            el.layer.setStyle({ color: el.color, weight: el.weight });
        } else if (el.type === 'camera') {
            if (el.layer._icon) {
                el.layer._icon.style.transform = el.layer._icon.style.transform.replace(' scale(1.3)', '');
            }
        }
    }

    // Przesuwanie mapy i otwieranie popupu/zaznaczanie elementu
    function selectAndPanToElement(id) {
        let el = elements[id];
        if (!el) return;
        if (el.type === 'camera') {
            let latLng = el.layer.getLatLng();
            map.setView(latLng, 16);
            el.layer.openPopup();
        } else if (el.type === 'fiber') {
            let latLngs = el.layer.getLatLngs();
            if (latLngs.length > 0) {
                map.setView(latLngs[0], 15);
                el.layer.openPopup();
            }
        }
    }

    // Zarządzanie widocznością pojedynczego elementu
    function toggleElementVisibility(id) {
        let el = elements[id];
        if (!el) return;
        if (el.visible === false) {
            el.visible = true;
            if (el.type === 'camera' && camerasGlobalVisible) {
                el.layer.addTo(map);
            } else if (el.type === 'fiber' && fibersGlobalVisible) {
                el.layer.addTo(map);
            }
        } else {
            el.visible = false;
            if (map.hasLayer(el.layer)) {
                map.removeLayer(el.layer);
            }
        }
        syncWithJava();
    }

    // Globalna widoczność kamer
    function showAllCameras() {
        camerasGlobalVisible = true;
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'camera' && el.visible !== false) {
                if (!map.hasLayer(el.layer)) {
                    el.layer.addTo(map);
                }
            }
        }
    }

    function hideAllCameras() {
        camerasGlobalVisible = false;
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'camera') {
                if (map.hasLayer(el.layer)) {
                    map.removeLayer(el.layer);
                }
            }
        }
    }

    // Globalna widoczność światłowodów
    function showAllFibers() {
        fibersGlobalVisible = true;
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'fiber' && el.visible !== false) {
                if (!map.hasLayer(el.layer)) {
                    el.layer.addTo(map);
                }
            }
        }
    }

    function hideAllFibers() {
        fibersGlobalVisible = false;
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'fiber') {
                if (map.hasLayer(el.layer)) {
                    map.removeLayer(el.layer);
                }
            }
        }
    }

    function enableCameraPlacement(name) {
        finishFiberDrawing();
        pendingCameraName = name;
    }

    function enableFiberDrawing(name) {
        finishFiberDrawing();
        pendingCameraName = null;
        isDrawingFiber = true;
        currentFiberName = name;
        fiberPoints = [];
    }

    // Cofnięcie ostatniego punktu podczas rysowania
    function undoLastFiberPoint() {
        if (isDrawingFiber && fiberPoints.length > 0) {
            fiberPoints.pop();
            if (fiberPoints.length === 0) {
                if (tempPolyline) {
                    map.removeLayer(tempPolyline);
                    tempPolyline = null;
                }
            } else {
                if (tempPolyline) {
                    tempPolyline.setLatLngs(fiberPoints);
                }
            }
        } else if (activeAppendFiberId !== null && fiberPoints.length > 1) {
            fiberPoints.pop();
            let el = elements[activeAppendFiberId];
            if (el && tempPolyline) {
                let existingPts = el.layer.getLatLngs();
                let combinedPts = (activeAppendEnd === 'start') ? fiberPoints.slice().reverse().concat(existingPts) : existingPts.concat(fiberPoints.slice(1));
                tempPolyline.setLatLngs(combinedPts);
            }
        }
    }

    // Anulowanie całego rysowania klawiszem ESC
    function cancelCurrentDrawing() {
        if (isDrawingFiber || activeAppendFiberId !== null || activeDeleteFiberId !== null) {
            if (tempPolyline) {
                map.removeLayer(tempPolyline);
                tempPolyline = null;
            }
            if (activeDeleteFiberId !== null) {
                disableFiberEditing(activeDeleteFiberId);
            }
            isDrawingFiber = false;
            currentFiberName = null;
            fiberPoints = [];
            activeAppendFiberId = null;
            activeAppendEnd = null;
            activeDeleteFiberId = null;
            syncWithJava();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            cancelCurrentDrawing();
        }
    });

    // Zatwierdzanie rysowania nowego lub dorysowywanego światłowodu
    function finishFiberDrawing() {
        if (isDrawingFiber) {
            if (fiberPoints.length >= 2) {
                var defaultColor = '#2980b9';
                var defaultWeight = 5;

                var polyline = L.polyline(fiberPoints, {color: defaultColor, weight: defaultWeight});
                if (fibersGlobalVisible) {
                    polyline.addTo(map);
                }

                let id = elementIdCounter++;
                let fiberObj = {
                    id: id,
                    type: 'fiber',
                    name: currentFiberName,
                    color: defaultColor,
                    weight: defaultWeight,
                    layer: polyline,
                    isEditing: false,
                    visible: true
                };

                elements[id] = fiberObj;
                fiberHistoryStack[id] = [];
                updateFiberPopup(fiberObj);
            }

            if (tempPolyline) {
                map.removeLayer(tempPolyline);
                tempPolyline = null;
            }

            isDrawingFiber = false;
            currentFiberName = null;
            fiberPoints = [];
        }

        // Jeśli kończymy dorysowywanie do istniejącego światłowodu
        if (activeAppendFiberId !== null) {
            let el = elements[activeAppendFiberId];
            if (el && fiberPoints.length > 1) {
                saveFiberStateToHistory(activeAppendFiberId);

                let existingPts = el.layer.getLatLngs();
                let newAppended = fiberPoints.slice(1);

                if (activeAppendEnd === 'start') {
                    let finalPts = fiberPoints.slice().reverse().concat(existingPts);
                    el.layer.setLatLngs(finalPts);
                } else {
                    let finalPts = existingPts.concat(newAppended);
                    el.layer.setLatLngs(finalPts);
                }
                updateFiberPopup(el);
            }

            if (tempPolyline) {
                map.removeLayer(tempPolyline);
                tempPolyline = null;
            }
            activeAppendFiberId = null;
            activeAppendEnd = null;
            fiberPoints = [];
        }

        syncWithJava();
    }

    map.on('click', function(e) {
        if (activeAppendFiberId !== null && activeAppendEnd !== null) {
            fiberPoints.push([e.latlng.lat, e.latlng.lng]);

            let el = elements[activeAppendFiberId];
            if (el) {
                let existingPts = el.layer.getLatLngs();
                let combinedPts = (activeAppendEnd === 'start') ? fiberPoints.slice().reverse().concat(existingPts) : existingPts.concat(fiberPoints.slice(1));

                if (!tempPolyline) {
                    tempPolyline = L.polyline(combinedPts, {color: el.color, weight: el.weight + 2, dashArray: '4, 4'}).addTo(map);
                } else {
                    tempPolyline.setLatLngs(combinedPts);
                }
            }
            return;
        }

        if (pendingCameraName) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var name = pendingCameraName;
            pendingCameraName = null;

            let id = elementIdCounter++;
            var marker = L.marker([lat, lng], { icon: createCameraIcon() });
            if (camerasGlobalVisible) {
                marker.addTo(map);
            }
            marker.bindPopup(createCameraPopupHtml(id, name));

            elements[id] = {
                type: 'camera',
                name: name,
                layer: marker,
                description: '',
                photos: [],
                visible: true
            };
            syncWithJava();

        } else if (isDrawingFiber) {
            fiberPoints.push([e.latlng.lat, e.latlng.lng]);

            if (!tempPolyline) {
                tempPolyline = L.polyline(fiberPoints, {color: '#3498db', weight: 4, dashArray: '5, 5'}).addTo(map);
            } else {
                tempPolyline.setLatLngs(fiberPoints);
            }
        }
    });

    map.on('dblclick', function(e) {
        if (isDrawingFiber || activeAppendFiberId !== null) {
            finishFiberDrawing();
        }
    });

    function getCameraData(id) {
        if (elements[id] && elements[id].type === 'camera') {
            return JSON.stringify({
                id: id,
                name: elements[id].name,
                description: elements[id].description || '',
                photos: elements[id].photos || []
            });
        }
        return null;
    }

    function updateCameraDetails(id, description, photosArray) {
        if (elements[id] && elements[id].type === 'camera') {
            elements[id].description = description;
            elements[id].photos = photosArray;
        }
    }

    function clearMap() {
        for (let id in elements) {
            disableFiberEditing(id);
            if (map.hasLayer(elements[id].layer)) {
                map.removeLayer(elements[id].layer);
            }
        }
        elements = {};
        fiberHistoryStack = {};
        elementIdCounter = 1;
        syncWithJava();
    }

    function addCameraFromDb(id, name, lat, lng, description, photos) {
        var keyId = id || elementIdCounter++;
        if (typeof keyId === 'number' && keyId >= elementIdCounter) {
            elementIdCounter = keyId + 1;
        }

        var marker = L.marker([lat, lng], { icon: createCameraIcon() });
        if (camerasGlobalVisible) {
            marker.addTo(map);
        }
        marker.bindPopup(createCameraPopupHtml(keyId, name));

        elements[keyId] = {
            type: 'camera',
            name: name,
            layer: marker,
            description: description || '',
            photos: photos || [],
            visible: true
        };

        map.panTo([lat, lng]);
        syncWithJava();
    }

    function addFiberFromDb(id, name, color, weight, points) {
        var keyId = id || elementIdCounter++;
        if (typeof keyId === 'number' && keyId >= elementIdCounter) {
            elementIdCounter = keyId + 1;
        }

        var polyline = L.polyline(points, {color: color, weight: weight});
        if (fibersGlobalVisible) {
            polyline.addTo(map);
        }

        let fiberObj = {
            id: keyId,
            type: 'fiber',
            name: name,
            color: color,
            weight: weight,
            layer: polyline,
            isEditing: false,
            visible: true
        };

        elements[keyId] = fiberObj;
        fiberHistoryStack[keyId] = [];
        updateFiberPopup(fiberObj);
        syncWithJava();
    }

    function getAllCamerasData() {
        var arr = [];
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'camera') {
                let pos = el.layer.getLatLng();
                arr.push({
                    name: el.name,
                    lat: pos.lat,
                    lng: pos.lng,
                    description: el.description || '',
                    photos: el.photos || []
                });
            }
        }
        return JSON.stringify(arr);
    }

    function getAllFibersData() {
        var arr = [];
        for (let id in elements) {
            let el = elements[id];
            if (el.type === 'fiber') {
                let latLngs = el.layer.getLatLngs();
                let pts = latLngs.map(p => [p.lat, p.lng]);
                arr.push({
                    name: el.name,
                    color: el.color,
                    weight: el.weight,
                    points: pts
                });
            }
        }
        return JSON.stringify(arr);
    }

    setTimeout(() => { map.invalidateSize(); }, 300);
    window.addEventListener('resize', function () {
        map.invalidateSize();
    });
</script>
</body>
</html>
